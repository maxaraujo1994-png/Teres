.button-menu .button-art{transform:translateY(-54.125%)}
.button-whatsapp .button-art{transform:translateY(-68.3125%)}
.button-instagram .button-art{transform:translateY(-82.125%)}
.link::after{content:"";position:absolute;z-index:2;right:11%;top:50%;width:9px;height:9px;border-top:2px solid #fff;border-right:2px solid #fff;transform:translateY(-50%) rotate(45deg);opacity:.95}
.link:focus-visible{outline:3px solid var(--orange);outline-offset:3px}
.link:hover{transform:translateY(-2px);filter:brightness(1.04)}.button-instagram::before{animation-delay:1.3s}
.link::after{z-index:4}
.icon{flex:0 0 43px;width:43px;height:43px;display:grid;place-items:center;border-radius:14px;background:#fff;color:var(--green-dark)}
.icon svg{width:25px;height:25px;display:block}
.instagram .icon{color:#d94572}
.copy{position:relative;z-index:1;min-width:0;display:grid;gap:3px;padding-right:20px;text-shadow:0 1px 2px #31531b66}
.copy strong{font-size:clamp(16px,4.3vw,19px);line-height:1.1}
.copy small{font-size:12px;line-height:1.15;opacity:.94;overflow-wrap:anywhere}
.arrow{margin-left:auto;font-size:24px;line-height:1;opacity:.85}
.footer{margin:22px 0 0;font-size:12px;color:#676a62;line-height:1.4}
.footer b{color:var(--green-dark)}
@media(max-width:360px){body{padding:0}.card{border-radius:0;min-height:100svh;box-shadow:none}.content{padding-left:18px;padding-right:18px}.logo-holder{width:142px;height:142px}}
@media(max-height:700px) and (min-width:361px){body{align-items:flex-start;padding-top:12px;padding-bottom:12px}.card{min-height:0}.content{margin-top:-58px}.logo-holder{width:134px;height:134px}.tagline{margin-bottom:16px}.links{gap:10px}.icon{width:39px;height:39px;flex-basis:39px}.footer{margin-top:15px}}

22%{opacity:.85}58%{transform:translateX(230%) skewX(-22deg);opacity:.65}64%,100%{transform:translateX(230%) skewX(-22deg);opacity:0}}

@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important}}
